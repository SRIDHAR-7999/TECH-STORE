<div id="page-loader">
  <div class="pl-inner">
    <div class="pl-mark"><span>S</span><span>M</span></div>

  <section class="page-hero container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i> <span>Wishlist</span></div>
    <h1 class="page-title">Your Wishlist</h1>
  </section>
  <section class="section container" style="padding-top:10px;">
    <div id="wish-empty" class="empty-state" style="display:none;">
      <i class="fa-solid fa-heart-crack"></i><h3>Your wishlist is empty</h3><p>Save products you love for later.</p>
      <a href="products.html" class="btn btn-primary" style="margin-top:14px;">Browse Products</a>
    </div>
    <div class="grid grid-products" id="wish-grid"></div>

<script>
document.addEventListener('DOMContentLoaded', function(){
function render(){
    const items = Wishlist.detailed();
    document.getElementById('wish-empty').style.display = items.length ? 'none' : 'block';
    document.getElementById('wish-grid').innerHTML = items.map(UI.productCardHTML).join('');
    Loader.initReveal();
  }
  document.addEventListener('wishlist:change', render);
  App.boot('shop').then(render);
});
</script>
