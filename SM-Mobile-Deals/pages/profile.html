<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('smd_theme') || 'dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — SM Mobile Deals</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#050812">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dark-mode.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="page-loader">
  <div class="pl-inner">
    <div class="pl-mark"><span>S</span><span>M</span></div>
    <div class="pl-title" id="pl-title" data-text="SM Mobile Deals"></div>
    <div class="pl-sub">Genuine tech, honest prices.</div>
    <div class="pl-bar"><div class="pl-bar-fill"></div></div>
  </div>
</div>
<div id="site-header"></div>

<main>
  <section class="page-hero container">
    <div class="breadcrumb"><a href="../index.html">Home</a> <i class="fa-solid fa-chevron-right" style="font-size:9px;"></i> <span>Profile</span></div>
    <h1 class="page-title">My Profile</h1>
  </section>
  <section class="section container" style="padding-top:10px;max-width:520px;" id="profile-root"></section>
</main>

<div id="site-footer"></div>

<script>const ROOT_PREFIX = '../';</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="../js/supabase-client.js"></script>
<script defer src="../js/config.js"></script>
<script defer src="../js/utils.js"></script>
<script defer src="../js/specs.js"></script>
<script defer src="../js/data.js"></script>
<script defer src="../js/auth.js"></script>
<script defer src="../js/cart.js"></script>
<script defer src="../js/notifications.js"></script>
<script defer src="../js/theme.js"></script>
<script defer src="../js/cursor.js"></script>
<script defer src="../js/loader.js"></script>
<script defer src="../js/search.js"></script>
<script defer src="../js/orders.js"></script>
<script defer src="../js/payment.js"></script>
<script defer src="../js/pincode.js"></script>
<script defer src="../js/checkout.js"></script>
<script defer src="../js/profile.js"></script>
<script defer src="../js/analytics.js"></script>
<script defer src="../js/admin.js"></script>
<script defer src="../js/chatbot.js"></script>
<script defer src="../js/reminders.js"></script>
<script defer src="../js/inbox.js"></script>
<script defer src="../js/branding.js"></script>

<script defer src="../js/celebrate.js"></script>
<script defer src="../js/ui.js"></script>
<script defer src="../js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
App.boot('').then(() => {
  const root = document.getElementById('profile-root');
  if (!Auth.requireLogin('login.html')){
    // redirected
  } else {
    const u = Auth.currentUser();
    if (u.role === 'admin'){ window.location.href = 'admin.html'; }
    root.innerHTML = `
      <div class="card" style="padding:26px;">
        <div class="flex items-center gap-16" style="margin-bottom:22px;">
          <div class="rc-avatar" style="width:56px;height:56px;font-size:20px;">${Utils.initials(u.name)}</div>
          <div><h3 style="font-family:var(--font-display);margin:0;">${Utils.escapeHtml(u.name)}</h3><span class="text-faint" style="font-size:13px;">${Utils.escapeHtml(u.email)}</span></div>
        </div>
        <form id="profile-form">
          <div class="field"><label>Full Name</label><input class="input" name="name" value="${Utils.escapeHtml(u.name)}" required></div>
          <div class="field"><label>Phone Number</label><input class="input" name="phone" value="${Utils.escapeHtml(u.phone||'')}"></div>
          <div class="field"><label>Pincode</label>
            <input class="input" name="pincode" id="prof-pincode" pattern="[0-9]{6}" maxlength="6" value="${Utils.escapeHtml(u.pincode||'')}">
            <span id="prof-pincode-status" class="text-faint" style="font-size:11.5px;"></span>
          </div>
          <div class="field"><label>Saved Address</label><textarea class="input" name="address" rows="3">${Utils.escapeHtml(u.address||'')}</textarea></div>
          <div class="field" style="display:flex;gap:12px;">
            <div style="flex:1;"><label>City / District</label><input class="input" name="city" id="prof-city" value="${Utils.escapeHtml(u.city||'')}"></div>
            <div style="flex:1;"><label>State</label><input class="input" name="state" id="prof-state" value="${Utils.escapeHtml(u.state||'')}"></div>
          </div>
          <button class="btn btn-primary btn-block" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
        </form>
      </div>
      <div class="card" style="padding:22px;margin-top:18px;">
        <div class="flex justify-between items-center">
          <div><strong style="font-family:var(--font-display);">My Orders</strong><div class="text-faint" style="font-size:12.5px;">View your order history & track deliveries</div></div>
          <a href="orders.html" class="btn btn-outline btn-sm">View</a>
        </div>
      </div>
      <button class="btn btn-outline btn-block" style="margin-top:18px;" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>

      <div class="card" style="padding:22px;margin-top:18px;border-color:var(--danger,#dc2626);">
        <strong style="font-family:var(--font-display);color:var(--danger,#dc2626);">Danger Zone</strong>
        <p class="text-faint" style="font-size:12.5px;margin:6px 0 14px;">Permanently delete your account. This cannot be undone — see our <a href="privacy.html" class="text-accent">Privacy Policy</a> for details.</p>
        <button class="btn btn-block" style="background:var(--danger,#dc2626);color:#fff;" id="delete-account-btn"><i class="fa-solid fa-trash-can"></i> Delete My Account</button>
      </div>`;

    document.getElementById('delete-account-btn').addEventListener('click', async () => {
      const typed = prompt('This permanently deletes your account, orders and saved details — it cannot be undone.\\n\\nType DELETE to confirm:');
      if (typed !== 'DELETE') return;
      // Extra safeguard for this one specific account only — every other
      // customer account deletes with just the DELETE confirmation above.
      const u = Auth.currentUser();
      if (u && u.email && u.email.toLowerCase() === '7999@gmail.com'){
        const adminPass = prompt('This account needs the store admin password to confirm deletion:');
        if (adminPass !== SITE_CONFIG.adminPassword){
          Notify.toast('Incorrect admin password — account was not deleted.', 'error');
          return;
        }
      }
      const res = await Auth.deleteAccount();
      if (res.ok){
        Notify.toast('Your account has been deleted.', 'success');
        setTimeout(() => { window.location.href = ROOT_PREFIX + 'index.html'; }, 1200);
      } else {
        Notify.toast(res.error || 'Could not delete your account.', 'error');
      }
    });

    document.getElementById('prof-pincode').addEventListener('input', Utils.debounce(async (e) => {
      const pin = e.target.value.trim();
      const statusEl = document.getElementById('prof-pincode-status');
      if (pin.length !== 6){ statusEl.textContent = ''; return; }
      statusEl.textContent = 'Looking up…'; statusEl.style.color = 'var(--text-faint)';
      const result = await Pincode.lookup(pin);
      if (!result.ok){ statusEl.textContent = result.error; statusEl.style.color = 'var(--danger)'; return; }
      document.getElementById('prof-city').value = result.district;
      document.getElementById('prof-state').value = result.state;
      statusEl.textContent = `✓ ${result.area}, ${result.district}, ${result.state}`;
      statusEl.style.color = 'var(--success)';
    }, 500));

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await Profile.save({ name: fd.get('name'), phone: fd.get('phone'), address: fd.get('address'), city: fd.get('city'), state: fd.get('state'), pincode: fd.get('pincode') });
      Notify.toast('Profile updated', 'success');
    });
    document.getElementById('logout-btn').addEventListener('click', async () => { await Auth.logout(); window.location.href = '../index.html'; });
  }
});
});
</script>
</body>
</html>
