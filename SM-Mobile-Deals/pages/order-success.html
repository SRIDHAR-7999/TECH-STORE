<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{document.documentElement.setAttribute('data-theme', localStorage.getItem('smd_theme') || 'dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Status — SM Mobile Deals</title>
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#050812">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../css/variables.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dark-mode.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<style>
  .status-wrap{ max-width:560px; margin:0 auto; text-align:center; padding:50px 0; }
</style>
</head>
<body>
<div id="page-loader">
  <div class="pl-inner">
    <div class="pl-mark"><span>S</span><span>M</span></div>
    <div class="pl-title" id="pl-title" data-text="SM Mobile Deals"></div>
    <div class="pl-sub">Genuine tech, honest prices.</div>
    <div class="pl-bar"><div class="pl-bar-fill"></div></div>
  </div>
</div>
<div id="site-header"></div>

<main>
  <section class="container status-wrap" id="status-root"></section>
</main>

<div id="site-footer"></div>

<script>const ROOT_PREFIX = '../';</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="../js/supabase-client.js"></script>
<script defer src="../js/config.js"></script>
<script defer src="../js/utils.js"></script>
<script defer src="../js/specs.js"></script>
<script defer src="../js/data.js"></script>
<script defer src="../js/auth.js"></script>
<script defer src="../js/cart.js"></script>
<script defer src="../js/notifications.js"></script>
<script defer src="../js/theme.js"></script>
<script defer src="../js/cursor.js"></script>
<script defer src="../js/loader.js"></script>
<script defer src="../js/search.js"></script>
<script defer src="../js/orders.js"></script>
<script defer src="../js/payment.js"></script>
<script defer src="../js/pincode.js"></script>
<script defer src="../js/checkout.js"></script>
<script defer src="../js/profile.js"></script>
<script defer src="../js/analytics.js"></script>
<script defer src="../js/admin.js"></script>
<script defer src="../js/chatbot.js"></script>
<script defer src="../js/reminders.js"></script>
<script defer src="../js/inbox.js"></script>
<script defer src="../js/branding.js"></script>

<script defer src="../js/celebrate.js"></script>
<script defer src="../js/ui.js"></script>
<script defer src="../js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
const orderId = Utils.qs('order');
  let pollTimer = null;

  function render(){
    const order = Orders.byId(orderId);
    const root = document.getElementById('status-root');
    if (!order){
      root.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-exclamation"></i><h3>Order not found</h3></div>`;
      return;
    }

    if (order.paymentMethod === 'advance' && order.paymentStatus === 'confirmed' && order.balanceStatus && order.balanceStatus !== 'paid'){
      clearInterval(pollTimer);
      const pendingConf = order.balanceStatus === 'pending_confirmation';
      root.innerHTML = `
        <div class="pending-ring"><i class="fa-solid fa-hand-holding-dollar"></i></div>
        <h1 style="font-family:var(--font-display);font-size:26px;margin:0 0 8px;">Advance Confirmed — Balance Due</h1>
        <p class="text-dim">Order <strong style="font-family:var(--font-mono);color:var(--text);">${order.id}</strong>: your ₹${order.totals.advanceAmount} booking advance is confirmed (non-refundable). ${pendingConf ? 'Your balance payment is awaiting confirmation.' : `Balance due: <strong>${Utils.formatINR(order.totals.balanceAmount)}</strong> — pay before 6:00 PM today for same-day courier dispatch, otherwise it ships the next day.`}</p>
        <div class="flex gap-12" style="justify-content:center;flex-wrap:wrap;margin-top:18px;">
          ${!pendingConf ? `<a href="payment.html?order=${order.id}" class="btn btn-primary"><i class="fa-solid fa-hand-holding-dollar"></i> Pay Balance</a>` : ''}
          <a href="orders.html" class="btn btn-outline">My Orders</a>
        </div>`;
    } else if (order.paymentStatus === 'confirmed' || order.paymentStatus === 'cod'){
      clearInterval(pollTimer);
      Celebrate.fireOnceFor(order.id);
      root.innerHTML = `
        <div class="check-circle"><i class="fa-solid fa-check"></i></div>
        <h1 style="font-family:var(--font-display);font-size:28px;margin:0 0 8px;">Order Successful!</h1>
        <p class="text-dim">Your order <strong style="font-family:var(--font-mono);color:var(--text);">${order.id}</strong> has been confirmed${order.paymentMethod==='cod'?' (Cash on Delivery)':''}.</p>
        ${order.dispatchNote ? `<p class="text-dim" style="background:var(--surface-2);padding:10px 14px;border-radius:10px;font-size:13px;"><i class="fa-solid fa-truck-fast"></i> ${Utils.escapeHtml(order.dispatchNote)}</p>` : ''}
        <div class="card" style="padding:20px;text-align:left;margin:24px 0;">
          <div class="flex justify-between" style="margin-bottom:8px;"><span class="text-dim">Amount</span><span style="font-family:var(--font-mono);font-weight:700;">${Utils.formatINR(order.totals.total)}</span></div>
          ${order.paymentMethod === 'cod' ? `<div class="flex justify-between" style="margin-bottom:8px;color:var(--pending);"><span class="text-dim">Due on delivery (cash)</span><span style="font-family:var(--font-mono);font-weight:700;">${Utils.formatINR(order.totals.codAmount)}</span></div>` : ''}
          <div class="flex justify-between" style="margin-bottom:8px;"><span class="text-dim">Delivery estimate</span><span>${order.deliveryEstimate}</span></div>
          <div class="flex justify-between"><span class="text-dim">Deliver to</span><span>${Utils.escapeHtml(order.address.city)}, ${Utils.escapeHtml(order.address.state)}</span></div>
        </div>
        <div class="flex gap-12" style="justify-content:center;flex-wrap:wrap;">
          <a href="tracking.html?order=${order.id}" class="btn btn-primary"><i class="fa-solid fa-truck"></i> Track Order</a>
          <a href="../index.html" class="btn btn-outline">Continue Shopping</a>
        </div>`;
    } else if (order.paymentStatus === 'pending_confirmation'){
      root.innerHTML = `
        <div class="pending-ring"><i class="fa-solid fa-hourglass-half"></i></div>
        <h1 style="font-family:var(--font-display);font-size:26px;margin:0 0 8px;">Payment Received</h1>
        <p class="text-dim">Order <strong style="font-family:var(--font-mono);color:var(--text);">${order.id}</strong> is <strong style="color:var(--pending);">waiting for confirmation</strong>. Our team is verifying your payment screenshot — this page updates automatically once it's approved.</p>
        <div class="card" style="padding:18px;text-align:left;margin:22px 0;">
          <div class="flex items-center gap-8" style="font-size:13.5px;"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Order placed</div>
          <div class="flex items-center gap-8" style="font-size:13.5px;margin-top:8px;"><i class="fa-solid fa-circle-check" style="color:var(--success);"></i> Payment screenshot uploaded</div>
          <div class="flex items-center gap-8" style="font-size:13.5px;margin-top:8px;"><i class="fa-solid fa-spinner spin" style="color:var(--pending);"></i> Waiting for admin confirmation</div>
        </div>
        <p class="text-faint" style="font-size:12.5px;">Usually confirmed within a few hours during store timings (${SITE_CONFIG.timings}). You can also check back on the <a href="orders.html" class="text-accent">My Orders</a> page.</p>`;
    } else if (order.paymentStatus === 'rejected'){
      root.innerHTML = `
        <div class="check-circle" style="background:var(--danger-soft);"><i class="fa-solid fa-xmark" style="color:var(--danger);"></i></div>
        <h1 style="font-family:var(--font-display);font-size:26px;margin:0 0 8px;">Payment Not Verified</h1>
        <p class="text-dim">We couldn't confirm the payment for order <strong style="font-family:var(--font-mono);color:var(--text);">${order.id}</strong>.</p>
        <p class="text-dim" style="background:var(--danger-soft);padding:12px 16px;border-radius:10px;">${Utils.escapeHtml(order.rejectReason||'')}</p>
        <a href="payment.html?order=${order.id}" class="btn btn-primary">Try Payment Again</a>`;
    } else {
      root.innerHTML = `
        <div class="pending-ring"><i class="fa-solid fa-qrcode"></i></div>
        <h1 style="font-family:var(--font-display);font-size:26px;margin:0 0 8px;">Payment Pending</h1>
        <p class="text-dim">Please complete your payment for order <strong style="font-family:var(--font-mono);color:var(--text);">${order.id}</strong>.</p>
        <a href="payment.html?order=${order.id}" class="btn btn-primary">Go to Payment</a>`;
    }
  }

  App.boot('shop').then(() => {
    render();
    pollTimer = setInterval(async () => { await Orders.refresh(); render(); }, 4000);
  });
});
</script>
</body>
</html>
